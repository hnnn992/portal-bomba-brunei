<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BFRD Presentation Remote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#040b17">
    <style>
        html, body {
            height: 100%;
            height: 100dvh;
            max-height: 100dvh;
            overflow: hidden !important;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: auto;
        }
        body {
            background-color: #040b17;
            background-image: radial-gradient(circle at 50% 20%, rgba(220, 38, 38, 0.22) 0%, transparent 60%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .btn-ctrl:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="text-white h-screen h-[100dvh] max-h-[100dvh] overflow-hidden flex flex-col justify-between p-2.5 sm:p-4 selection:bg-red-600">

    <!-- Header Status with Fullscreen & Disconnect Buttons -->
    <header class="flex items-center justify-between border-b border-slate-800/80 pb-2 flex-shrink-0">
        <div class="flex items-center gap-2">
            <div id="iconStatus" class="w-8 h-8 rounded-xl bg-amber-500/20 text-amber-400 border border-amber-500/40 flex items-center justify-center font-bold text-xs shadow-lg">
                <i class="fa-solid fa-gamepad"></i>
            </div>
            <div>
                <h1 class="text-[11px] font-black tracking-wider uppercase text-slate-100">BFRD Remote</h1>
                <p id="statusTxt" class="text-[9px] text-amber-400 font-semibold flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse inline-block"></span> Menyambung...
                </p>
            </div>
        </div>

        <!-- Actions: Fullscreen & Disconnect -->
        <div class="flex items-center gap-1.5">
            <button id="btnFullscreen" onclick="toggleFullscreen()" class="btn-ctrl text-xs font-bold px-2 py-1 rounded-xl border border-slate-700 bg-slate-800/90 hover:bg-slate-700 text-amber-300 transition-all flex items-center gap-1 shadow" title="Skrin Penuh (Fullscreen)">
                <i id="iconFullscreen" class="fa-solid fa-expand text-[11px]"></i>
                <span id="txtFullscreen" class="hidden sm:inline text-[10px]">Fullscreen</span>
            </button>
            <button id="btnDisconnect" onclick="handleDisconnectClick()" class="btn-ctrl text-xs font-bold px-2.5 py-1 rounded-xl border border-red-500/50 bg-red-950/60 hover:bg-red-900 text-red-200 transition-all flex items-center gap-1 shadow">
                <i id="btnDisconnectIcon" class="fa-solid fa-power-off text-[10px] text-red-400"></i>
                <span id="btnDisconnectText" class="text-[10px]">Putuskan</span>
            </button>
        </div>
    </header>

    <!-- Manual Room ID Box (Fallback if URL query parameter was not passed) -->
    <div id="manualIdCard" class="hidden my-3 p-3 rounded-2xl bg-slate-900/90 border border-amber-500/30 text-center shadow-lg">
        <div class="text-[11px] font-bold text-amber-300 mb-1.5 flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-key"></i> <span>Masukkan Kod ID Bilik Komputer:</span>
        </div>
        <div class="flex gap-2">
            <input type="text" id="manualIdInput" placeholder="Contoh: BFRD-1234" class="flex-1 px-3 py-1.5 text-xs rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 uppercase text-center font-bold tracking-wider">
            <button onclick="connectWithManualId()" class="px-3.5 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl">Sambung</button>
        </div>
    </div>

    <!-- Main Controller Pad -->
        <!-- Main Controller Pad (Compact, Zero-Scroll Architecture) -->
    <main class="flex-1 flex flex-col justify-between py-1.5 gap-2 overflow-hidden">
        <!-- Big Navigation Buttons -->
        <div class="grid grid-cols-2 gap-2.5 flex-shrink-0">
            <button onclick="sendCommand({action: 'prev'})" class="btn-ctrl bg-slate-800/95 active:bg-slate-700 border-2 border-slate-700 py-3.5 sm:py-5 rounded-2xl flex items-center justify-center gap-2 shadow-lg">
                <i class="fa-solid fa-chevron-left text-xl text-amber-400"></i>
                <span class="text-xs sm:text-sm font-extrabold uppercase tracking-wider text-slate-200">Sebelum (Prev)</span>
            </button>
            <button onclick="sendCommand({action: 'next'})" class="btn-ctrl bg-gradient-to-r from-red-600 to-red-800 active:from-red-700 active:to-red-900 border-2 border-red-500/50 py-3.5 sm:py-5 rounded-2xl flex items-center justify-center gap-2 shadow-xl">
                <span class="text-xs sm:text-sm font-extrabold uppercase tracking-wider text-white">Berikut (Next)</span>
                <i class="fa-solid fa-chevron-right text-xl text-white"></i>
            </button>
        </div>

        <!-- Language Switch -->
        <div class="grid grid-cols-2 gap-2 bg-slate-900/90 p-1.5 rounded-xl border border-slate-800 flex-shrink-0">
            <button id="btnLangMs" onclick="handleLangClick('ms')" class="btn-ctrl py-1.5 rounded-lg font-bold text-xs bg-amber-500/20 text-amber-300 border-2 border-amber-400 shadow transition-all">
                Bahasa Melayu

            <button id="btnLangEn" onclick="handleLangClick('en')" class="btn-ctrl py-1.5 rounded-lg font-semibold text-xs bg-slate-800 text-slate-400 border border-slate-700 transition-all">

                <i class="fa-solid fa-ranking-star text-[10px]"></i>
                <span id="txtTabRanks">Kelayakan Jawatan</span>
            </button>
        </div>

        <!-- Tab Panel 1: Direct 12 Modules Jumper -->
        <div id="panelModules" class="flex-1 overflow-y-auto pr-0.5 space-y-1">
            <div class="grid grid-cols-2 gap-1.5 text-xs">

                <button onclick="handleModuleClick(3)" data-slide="3" class="btn-ctrl module-btn py-1.5 px-2 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate text-[11px]">4. Kerja Khas (Bukan Kecemasan)</button>

                <button onclick="handleModuleClick(5)" data-slide="5" class="btn-ctrl module-btn py-1.5 px-2 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate text-[11px]">6. Syarat Kelayakan Am</button>
                <button onclick="handleModuleClick(6)" data-slide="6" class="btn-ctrl module-btn py-1.5 px-2 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate text-[11px]">7. Kelayakan Jawatan</button>
                <button onclick="handleModuleClick(7)" data-slide="7" class="btn-ctrl module-btn py-1.5 px-2 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate text-[11px]">8. Syarat Kelayakan Fizikal</button>
                <button onclick="handleModuleClick(8)" data-slide="8" class="btn-ctrl module-btn py-1.5 px-2 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate text-[11px]">9. Ujian Kecergasan (IPPT)</button>
                <button onclick="handleModuleClick(9)" data-slide="9" class="btn-ctrl module-btn py-1.5 px-2 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate text-[11px]">10. Ujian Praktikal</button>
                <button onclick="handleModuleClick(10)" data-slide="10" class="btn-ctrl module-btn py-1.5 px-2 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate text-[11px]">11. Kursus / Latihan</button>
                <button onclick="handleModuleClick(11)" data-slide="11" class="btn-ctrl module-btn py-1.5 px-2 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate text-[11px]">12. Hubungi Kami</button>
            </div>
        </div>

        <!-- Tab Panel 2: Kelayakan Jawatan Quick Selector (Pop-up Perbesar) -->
        <div id="panelRanks" class="hidden flex-1 flex flex-col justify-between bg-slate-900/90 p-2.5 rounded-2xl border border-slate-800 transition-all gap-2 overflow-y-auto">
            <div class="flex items-center justify-between flex-shrink-0">
                <div class="text-[11px] font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-ranking-star"></i>
                    <span id="txtRankHeader">Kelayakan Jawatan (Pop-up Perbesar):</span>
                </div>
                <button id="btnCloseRank" onclick="sendCommand({action: 'closeRank'})" class="hidden text-[10px] font-bold px-2 py-0.5 rounded-lg bg-red-950/80 border border-red-500/50 text-red-300 hover:bg-red-900 flex items-center gap-1 transition-all">
                    <i class="fa-solid fa-xmark"></i>
                    <span id="txtCloseRank">Tutup Pop-up</span>

            </div>

            <!-- 6 Jawatan Buttons Grid -->
            <div class="grid grid-cols-2 gap-1.5 text-xs">
                <button onclick="handleRankClick(0)" data-rank="0" class="btn-ctrl rank-btn p-2 rounded-xl bg-slate-800/90 border border-slate-700 text-left font-bold text-slate-200 transition-all flex flex-col gap-0.5 shadow">
                    <div class="flex items-center justify-between w-full">
                        <span class="text-[9px] uppercase tracking-wide text-amber-400 font-extrabold">Divisi II</span>
                        <i class="fa-solid fa-expand text-[9px] text-slate-400"></i>
                    </div>
                    <span class="truncate text-[11px] font-semibold rank-title">1. Penguasa Bomba & Penyelamat</span>
                </button>
                <button onclick="handleRankClick(1)" data-rank="1" class="btn-ctrl rank-btn p-2 rounded-xl bg-slate-800/90 border border-slate-700 text-left font-bold text-slate-200 transition-all flex flex-col gap-0.5 shadow">
                    <div class="flex items-center justify-between w-full">
                        <span class="text-[9px] uppercase tracking-wide text-amber-400 font-extrabold">Divisi III</span>
                        <i class="fa-solid fa-expand text-[9px] text-slate-400"></i>
                    </div>
                    <span class="truncate text-[11px] font-semibold rank-title">2. Timbalan Penguasa Bomba</span>
                </button>
                <button onclick="handleRankClick(2)" data-rank="2" class="btn-ctrl rank-btn p-2 rounded-xl bg-slate-800/90 border border-slate-700 text-left font-bold text-slate-200 transition-all flex flex-col gap-0.5 shadow">
                    <div class="flex items-center justify-between w-full">
                        <span class="text-[9px] uppercase tracking-wide text-amber-400 font-extrabold">Divisi III</span>
                        <i class="fa-solid fa-expand text-[9px] text-slate-400"></i>
                    </div>
                    <span class="truncate text-[11px] font-semibold rank-title">3. Penolong Penguasa Bomba</span>
                </button>
                <button onclick="handleRankClick(3)" data-rank="3" class="btn-ctrl rank-btn p-2 rounded-xl bg-slate-800/90 border border-slate-700 text-left font-bold text-slate-200 transition-all flex flex-col gap-0.5 shadow">
                    <div class="flex items-center justify-between w-full">
                        <span class="text-[9px] uppercase tracking-wide text-amber-400 font-extrabold">Divisi IV</span>
                        <i class="fa-solid fa-expand text-[9px] text-slate-400"></i>
                    </div>
                    <span class="truncate text-[11px] font-semibold rank-title">4. Pegawai Balai</span>
                </button>
                <button onclick="handleRankClick(4)" data-rank="4" class="btn-ctrl rank-btn p-2 rounded-xl bg-slate-800/90 border border-slate-700 text-left font-bold text-slate-200 transition-all flex flex-col gap-0.5 shadow">
                    <div class="flex items-center justify-between w-full">
                        <span class="text-[9px] uppercase tracking-wide text-amber-400 font-extrabold">Divisi IV</span>
                        <i class="fa-solid fa-expand text-[9px] text-slate-400"></i>
                    </div>
                    <span class="truncate text-[11px] font-semibold rank-title">5. Timbalan Pegawai Balai</span>
                </button>
                <button onclick="handleRankClick(5)" data-rank="5" class="btn-ctrl rank-btn p-2 rounded-xl bg-slate-800/90 border border-slate-700 text-left font-bold text-slate-200 transition-all flex flex-col gap-0.5 shadow">
                    <div class="flex items-center justify-between w-full">
                        <span class="text-[9px] uppercase tracking-wide text-amber-400 font-extrabold">Divisi V</span>
                        <i class="fa-solid fa-expand text-[9px] text-slate-400"></i>
                    </div>
                    <span class="truncate text-[11px] font-semibold rank-title">6. Ahli Bomba</span>
                </button>
            </div>

            <!-- Rank Sub Navigation Buttons -->
            <div id="rankNavControls" class="grid grid-cols-3 gap-1.5 pt-0.5 flex-shrink-0">
                <button onclick="sendCommand({action: 'prevRank'})" class="btn-ctrl py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-[10px] border border-slate-700 flex items-center justify-center gap-1 shadow">
                    <i class="fa-solid fa-chevron-left text-[9px]"></i>
                    <span id="txtPrevRank">Sebelum</span>
                </button>
                <button onclick="sendCommand({action: 'closeRank'})" class="btn-ctrl py-1.5 rounded-xl bg-red-950/60 hover:bg-red-900/80 text-red-200 font-bold text-[10px] border border-red-500/40 flex items-center justify-center gap-1 shadow">
                    <i class="fa-solid fa-xmark text-[9px]"></i>
                    <span id="txtCloseRankBtn">Tutup Pop-up</span>
                </button>
                <button onclick="sendCommand({action: 'nextRank'})" class="btn-ctrl py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-[10px] border border-slate-700 flex items-center justify-center gap-1 shadow">
                    <span id="txtNextRank">Berikut</span>
                    <i class="fa-solid fa-chevron-right text-[9px]"></i>

            </div>
        </div>
    </main>

    <!-- Footer Controls with Ke Muka Depan & Buka Slaid (View Slides) -->
    <footer class="pt-3 border-t border-slate-800 flex justify-between items-center gap-2.5 text-xs">
        <button onclick="sendCommand({action: 'home'})" class="btn-ctrl flex-1 py-2.5 rounded-xl bg-slate-800/90 active:bg-slate-700 text-slate-200 font-bold border border-slate-700 flex items-center justify-center gap-1.5 transition-all">
            <i class="fa-solid fa-house text-amber-400"></i>
            <span>Ke Muka Depan</span>
        </button>
        <button onclick="sendCommand({action: 'openSlides'})" class="btn-ctrl flex-1 py-2.5 rounded-xl bg-gradient-to-r from-red-700 to-red-600 active:from-red-800 active:to-red-700 text-white font-bold border border-amber-500/50 flex items-center justify-center gap-1.5 shadow-lg shadow-red-950/60 transition-all">
            <i class="fa-solid fa-book-open text-amber-300"></i>
            <span>Buka Slaid (View Slides)</span>
        </button>
    </footer>

    <!-- Rock-Solid WebSocket Real-Time Connection Logic (Zero Emojis, Works on Any Network/4G/5G) -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let currentTargetId = urlParams.get('id');

        const statusTxt = document.getElementById('statusTxt');
        const iconStatus = document.getElementById('iconStatus');
        const btnDisconnect = document.getElementById('btnDisconnect');
        const btnDisconnectText = document.getElementById('btnDisconnectText');
        const btnDisconnectIcon = document.getElementById('btnDisconnectIcon');
        const manualIdCard = document.getElementById('manualIdCard');
        const manualIdInput = document.getElementById('manualIdInput');

        let mqttClient = null;
        let isConnected = false;
        let isIntentionalDisconnect = false;
        let connectTimeout = null;

        const BROKERS = [
            { host: "broker.hivemq.com", port: 8884, path: "/mqtt" },
            { host: "broker.emqx.io", port: 8084, path: "/mqtt" }
        ];
        let currentBrokerIndex = 0;

        function startConnection() {
            isIntentionalDisconnect = false;
            clearTimeout(connectTimeout);

            if (!currentTargetId) {
                statusTxt.className = "text-[10px] text-amber-400 font-semibold flex items-center gap-1.5";
                statusTxt.innerHTML = '<i class="fa-solid fa-circle-exclamation text-amber-400"></i> Sila masukkan Kod ID Bilik di bawah:';
                manualIdCard.classList.remove('hidden');
                btnDisconnect.className = "text-xs font-bold px-3 py-1.5 rounded-xl border border-emerald-500/50 bg-emerald-950/60 hover:bg-emerald-900 text-emerald-200 transition-all flex items-center gap-1.5 shadow-md";
                btnDisconnectIcon.className = "fa-solid fa-plug text-[11px] text-emerald-400";
                btnDisconnectText.textContent = "Sambung (Connect)";
                return;
            }

            manualIdCard.classList.add('hidden');
            statusTxt.className = "text-[10px] text-amber-400 font-semibold flex items-center gap-1.5";
            statusTxt.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse inline-block mr-1"></span> Menyambung ke skrin komputer...';
            iconStatus.className = "w-9 h-9 rounded-xl bg-amber-500/20 text-amber-400 border border-amber-500/40 flex items-center justify-center font-bold text-sm shadow-lg";
            btnDisconnect.className = "text-xs font-bold px-3 py-1.5 rounded-xl border border-red-500/50 bg-red-950/60 hover:bg-red-900 text-red-200 transition-all flex items-center gap-1.5 shadow-md";
            btnDisconnectIcon.className = "fa-solid fa-power-off text-[11px] text-red-400";
            btnDisconnectText.textContent = "Putuskan (Disconnect)";

            if (mqttClient && mqttClient.isConnected()) {
                try { mqttClient.disconnect(); } catch(e) {}
            }

            const broker = BROKERS[currentBrokerIndex];
            const clientId = "bfrd_remote_" + Math.random().toString(16).substr(2, 8);
            mqttClient = new Paho.MQTT.Client(broker.host, broker.port, broker.path, clientId);

            mqttClient.onConnectionLost = function(responseObject) {
                if (!isIntentionalDisconnect) {
                    console.warn("MQTT connection lost:", responseObject.errorMessage);
                    setDisconnectedUI(false);
                    // Auto reconnect after 3 seconds
                    setTimeout(() => {
                        if (!isIntentionalDisconnect && currentTargetId) {
                            startConnection();
                        }
                    }, 3000);
                }
            };

            mqttClient.onMessageArrived = function(message) {
                try {
                    const data = JSON.parse(message.payloadString);
                    if (data.status === 'online' || data.status === 'ready') {
                        setConnectedUI();
                    }
                    if (typeof data.slide === 'number') {
                        setActiveSlideButton(data.slide);
                    }
                    if (data.lang) {
                        setLanguageUI(data.lang);
                    }
                    if (typeof data.rank === 'number') {
                        if (data.isModalOpen) {
                            setActiveRankButton(data.rank);
                        } else {
                            setActiveRankButton(-1);
                        }
                    } else if (data.isModalOpen === false) {
                        setActiveRankButton(-1);
                    }
                } catch(e) {}
            };

            const options = {
                useSSL: true,
                timeout: 6,
                keepAliveInterval: 30,
                cleanSession: true,
                onSuccess: function() {
                    console.log("Connected to broker:", broker.host);
                    // Subscribe to host status
                    const statusTopic = "bfrd/room/" + currentTargetId + "/status";
                    mqttClient.subscribe(statusTopic, { qos: 1 });

                    // Send ping to host
                    sendCommand({ action: 'ping' });

                    // Mark as connected
                    setConnectedUI();
                },
                onFailure: function(err) {
                    console.error("Broker connection failed:", err);
                    // Try next broker
                    currentBrokerIndex = (currentBrokerIndex + 1) % BROKERS.length;
                    if (!isIntentionalDisconnect) {
                        setTimeout(startConnection, 1500);
                    }
                }
            };

            try {
                mqttClient.connect(options);
            } catch(e) {
                console.error("MQTT client error:", e);
                setDisconnectedUI(false);
            }
        }

        function setConnectedUI() {
            isConnected = true;
            statusTxt.className = "text-[10px] text-emerald-400 font-bold flex items-center gap-1.5";
            statusTxt.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 inline-block mr-1"></span> Tersambung dengan Skrin Komputer!';
            iconStatus.className = "w-9 h-9 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 flex items-center justify-center font-bold text-sm shadow-lg shadow-emerald-950";
            btnDisconnect.className = "text-xs font-bold px-3 py-1.5 rounded-xl border border-red-500/50 bg-red-950/60 hover:bg-red-900 text-red-200 transition-all flex items-center gap-1.5 shadow-md";
            btnDisconnectIcon.className = "fa-solid fa-power-off text-[11px] text-red-400";
            btnDisconnectText.textContent = "Putuskan (Disconnect)";
            if (navigator.vibrate) navigator.vibrate(50);
        }

        function setDisconnectedUI(showManual) {
            isConnected = false;
            statusTxt.className = "text-[10px] text-red-400 font-semibold flex items-center gap-1.5";
            statusTxt.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-400 inline-block mr-1"></span> Sambungan Terputus (Disconnected).';
            iconStatus.className = "w-9 h-9 rounded-xl bg-red-500/20 text-red-400 border border-red-500/40 flex items-center justify-center font-bold text-sm shadow-lg";
            btnDisconnect.className = "text-xs font-bold px-3 py-1.5 rounded-xl border border-emerald-500/50 bg-emerald-950/60 hover:bg-emerald-900 text-emerald-200 transition-all flex items-center gap-1.5 shadow-md";
            btnDisconnectIcon.className = "fa-solid fa-plug text-[11px] text-emerald-400";
            btnDisconnectText.textContent = "Sambung Semula (Reconnect)";
            if (showManual || !currentTargetId) {
                manualIdCard.classList.remove('hidden');
            }
        }

        function handleDisconnectClick() {
            if (isConnected || (mqttClient && mqttClient.isConnected())) {
                isIntentionalDisconnect = true;
                if (mqttClient) {
                    try { mqttClient.disconnect(); } catch(e) {}
                }
                setDisconnectedUI(false);
            } else {
                startConnection();
            }
        }

        function connectWithManualId() {
            const val = manualIdInput.value.trim().toUpperCase();
            if (val) {
                currentTargetId = val;
                startConnection();
            }
        }

        function sendCommand(data) {
            if (mqttClient && mqttClient.isConnected() && currentTargetId) {
                try {
                    const message = new Paho.MQTT.Message(JSON.stringify(data));
                    message.destinationName = "bfrd/room/" + currentTargetId + "/cmd";
                    message.qos = 1;
                    mqttClient.send(message);
                    if (navigator.vibrate) navigator.vibrate(25);
                } catch(e) {
                    console.error("Send error:", e);
                }
            } else {
                // Flash status bar warning
                const prevHtml = statusTxt.innerHTML;
                const prevClass = statusTxt.className;
                statusTxt.className = "text-[10px] text-amber-400 font-semibold flex items-center gap-1.5";
                statusTxt.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Belum tersambung. Tekan Sambung Semula.';
                setTimeout(() => {
                    statusTxt.className = prevClass;
                    statusTxt.innerHTML = prevHtml;
                }, 2500);
            }
        }

        
        
        let currentLanguage = 'ms';

        const RANK_NAMES = {
            ms: [
                "1. Penguasa Bomba & Penyelamat",
                "2. Timbalan Penguasa Bomba",
                "3. Penolong Penguasa Bomba",
                "4. Pegawai Balai",
                "5. Timbalan Pegawai Balai",
                "6. Ahli Bomba"
            ],
            en: [
                "1. Superintendent of Fire & Rescue",
                "2. Deputy Superintendent",
                "3. Assistant Superintendent",
                "4. Station Officer",
                "5. Deputy Station Officer",
                "6. Firefighter"
            ]
        };

        const MODULE_NAMES = {
            ms: [
                "1. Visi & Misi",
                "2. Tugas & Tanggungjawab",
                "3. Perkhidmatan Khas",
                "4. Kerja Khas (Bukan Kecemasan)",
                "5. Tatacara Memohon",
                "6. Syarat Kelayakan Am",
                "7. Kelayakan Jawatan",
                "8. Syarat Kelayakan Fizikal",
                "9. Ujian Kecergasan (IPPT)",
                "10. Ujian Praktikal",
                "11. Kursus / Latihan",
                "12. Hubungi Kami"
            ],
            en: [
                "1. Vision & Mission",
                "2. Duties & Responsibilities",
                "3. Special Services",
                "4. Special Duties (Non-Emergency)",
                "5. How to Apply",
                "6. General Requirements",
                "7. Position Requirements",
                "8. Physical Requirements",
                "9. Fitness Test (IPPT)",
                "10. Practical Test",
                "11. Courses / Training",
                "12. Contact Us"
            ]
        };

        function setLanguageUI(lang) {
            currentLanguage = lang;
            const btnMs = document.getElementById('btnLangMs');
            const btnEn = document.getElementById('btnLangEn');
            if (btnMs && btnEn) {
                if (lang === 'ms') {
                    btnMs.className = "btn-ctrl py-2.5 rounded-xl font-bold text-xs bg-amber-500/20 text-amber-300 border-2 border-amber-400 shadow-md transition-all";
                    btnEn.className = "btn-ctrl py-2.5 rounded-xl font-semibold text-xs bg-slate-800 text-slate-400 border border-slate-700 transition-all";
                } else {
                    btnEn.className = "btn-ctrl py-2.5 rounded-xl font-bold text-xs bg-sky-500/20 text-sky-300 border-2 border-sky-400 shadow-md transition-all";
                    btnMs.className = "btn-ctrl py-2.5 rounded-xl font-semibold text-xs bg-slate-800 text-slate-400 border border-slate-700 transition-all";
                }
            }

            // Update rank titles
            const titles = RANK_NAMES[lang] || RANK_NAMES.ms;
            document.querySelectorAll('.rank-title').forEach((el, idx) => {
                if (titles[idx]) el.textContent = titles[idx];
            });

            // Update rank header and buttons text
            const txtRankHeader = document.getElementById('txtRankHeader');
            if (txtRankHeader) txtRankHeader.textContent = (lang === 'en') ? 'Position Requirements (Pop-up Enlarge):' : 'Kelayakan Jawatan (Pop-up Perbesar):';
            const txtTabModules = document.getElementById('txtTabModules');
            if (txtTabModules) txtTabModules.textContent = (lang === 'en') ? '12 Slide Modules' : '12 Modul Slaid';
            const txtTabRanks = document.getElementById('txtTabRanks');
            if (txtTabRanks) txtTabRanks.textContent = (lang === 'en') ? 'Position Requirements' : 'Kelayakan Jawatan';
            const txtCloseRank = document.getElementById('txtCloseRank');
            if (txtCloseRank) txtCloseRank.textContent = (lang === 'en') ? 'Close Pop-up' : 'Tutup Pop-up';
            const txtCloseRankBtn = document.getElementById('txtCloseRankBtn');
            if (txtCloseRankBtn) txtCloseRankBtn.textContent = (lang === 'en') ? 'Close Pop-up' : 'Tutup Pop-up';
            const txtPrevRank = document.getElementById('txtPrevRank');
            if (txtPrevRank) txtPrevRank.textContent = (lang === 'en') ? 'Prev' : 'Sebelum';
            const txtNextRank = document.getElementById('txtNextRank');
            if (txtNextRank) txtNextRank.textContent = (lang === 'en') ? 'Next' : 'Berikut';

            // Update module button titles
            const modTitles = MODULE_NAMES[lang] || MODULE_NAMES.ms;
            document.querySelectorAll('.module-btn').forEach((btn, idx) => {
                if (modTitles[idx]) btn.textContent = modTitles[idx];
            });
        }

        function handleLangClick(lang) {
            setLanguageUI(lang);
            sendCommand({ action: 'setLang', lang: lang });
        }

                        // Fullscreen Toggle
        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const el = document.documentElement;
                if (el.requestFullscreen) {
                    el.requestFullscreen().catch(() => {});
                } else if (el.webkitRequestFullscreen) {
                    el.webkitRequestFullscreen();
                }
                updateFullscreenUI(true);
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
                updateFullscreenUI(false);
            }
        }

        function updateFullscreenUI(isFullscreen) {
            const icon = document.getElementById('iconFullscreen');
            const txt = document.getElementById('txtFullscreen');
            if (icon) {
                icon.className = isFullscreen ? 'fa-solid fa-compress text-[11px]' : 'fa-solid fa-expand text-[11px]';
            }
            if (txt) {
                txt.textContent = isFullscreen ? (currentLanguage === 'en' ? 'Exit Full' : 'Keluar Skrin') : (currentLanguage === 'en' ? 'Fullscreen' : 'Skrin Penuh');
            }
        }

        document.addEventListener('fullscreenchange', () => updateFullscreenUI(!!document.fullscreenElement));
        document.addEventListener('webkitfullscreenchange', () => updateFullscreenUI(!!document.webkitFullscreenElement));

        // Tab Switcher between Modules and Ranks
        let currentRemoteTab = 'modules';
        function switchRemoteTab(tab) {
            currentRemoteTab = tab;
            const btnMod = document.getElementById('tabBtnModules');
            const btnRk = document.getElementById('tabBtnRanks');
            const panelMod = document.getElementById('panelModules');
            const panelRk = document.getElementById('panelRanks');

            if (tab === 'modules') {
                if (btnMod) btnMod.className = "flex-1 py-1.5 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/40 transition-all flex items-center justify-center gap-1.5 shadow";
                if (btnRk) btnRk.className = "flex-1 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 transition-all flex items-center justify-center gap-1.5";
                if (panelMod) panelMod.classList.remove('hidden');
                if (panelRk) panelRk.classList.add('hidden');
            } else {
                if (btnRk) btnRk.className = "flex-1 py-1.5 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/40 transition-all flex items-center justify-center gap-1.5 shadow";
                if (btnMod) btnMod.className = "flex-1 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 transition-all flex items-center justify-center gap-1.5";
                if (panelMod) panelMod.classList.add('hidden');
                if (panelRk) panelRk.classList.remove('hidden');
            }
        }

        let currentActiveRank = -1;

        function handleRankClick(rankIndex) {
            setActiveRankButton(rankIndex);
            switchRemoteTab('ranks');
            setActiveSlideButton(6);
            sendCommand({ action: 'openRank', rank: rankIndex });
        }

        function setActiveRankButton(rankIndex) {
            currentActiveRank = rankIndex;
            const rankButtons = document.querySelectorAll('.rank-btn');
            const closeBtn = document.getElementById('btnCloseRank');
            const rankCard = document.getElementById('rankSelectorCard');

            rankButtons.forEach((btn) => {
                const btnRank = parseInt(btn.getAttribute('data-rank'), 10);
                if (btnRank === rankIndex) {
                    btn.className = "btn-ctrl rank-btn p-2.5 rounded-xl bg-amber-500/25 border-2 border-amber-400 text-amber-200 shadow-lg shadow-amber-950/50 flex flex-col gap-0.5 transition-all scale-[1.02]";
                } else {
                    btn.className = "btn-ctrl rank-btn p-2.5 rounded-xl bg-slate-800/90 border border-slate-700 text-left font-bold text-slate-200 transition-all flex flex-col gap-0.5 shadow";
                }
            });

            if (closeBtn) {
                if (rankIndex >= 0) {
                    closeBtn.classList.remove('hidden');
                } else {
                    closeBtn.classList.add('hidden');
                }
            }

            if (rankCard) {
                if (rankIndex >= 0) {
                    rankCard.classList.add('border-amber-500/60', 'ring-1', 'ring-amber-500/40');
                    rankCard.classList.remove('border-slate-800');
                } else {
                    rankCard.classList.remove('border-amber-500/60', 'ring-1', 'ring-amber-500/40');
                    rankCard.classList.add('border-slate-800');
                }
            }
        }

        let currentActiveSlide = 0;

        function setActiveSlideButton(slideIndex) {
            if (typeof slideIndex !== 'number') return;
            currentActiveSlide = slideIndex;
            const buttons = document.querySelectorAll('.module-btn');
            buttons.forEach((btn, idx) => {
                if (idx === slideIndex) {
                    btn.className = "btn-ctrl module-btn p-2.5 rounded-xl bg-amber-500/20 border-2 border-amber-400 text-left font-bold text-amber-300 truncate shadow-lg shadow-amber-950/50 transition-all";
                } else {
                    btn.className = "btn-ctrl module-btn p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate transition-all";
                }
            });

            // Auto-switch to rank tab if user navigates to slide 7
            if (slideIndex === 6) {
                switchRemoteTab('ranks');
            }
        }

        function handleModuleClick(slideIndex) {
            setActiveSlideButton(slideIndex);
            sendCommand({ action: 'goto', slide: slideIndex });
        }

        // Highlight initial slide & auto start connection
        setActiveSlideButton(0);
        startConnection();
    </script>
</body>
</html>

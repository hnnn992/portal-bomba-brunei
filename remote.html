<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BFRD Presentation Remote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body {
            background-color: #040b17;
            background-image: radial-gradient(circle at 50% 20%, rgba(220, 38, 38, 0.22) 0%, transparent 60%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            touch-action: manipulation;
        }
        .btn-ctrl:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between p-4 selection:bg-red-600">

    <!-- Header Status with Disconnect Button -->
    <header class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2.5">
            <div id="iconStatus" class="w-9 h-9 rounded-xl bg-amber-500/20 text-amber-400 border border-amber-500/40 flex items-center justify-center font-bold text-sm shadow-lg">
                <i class="fa-solid fa-gamepad"></i>
            </div>
            <div>
                <h1 class="text-xs font-black tracking-wider uppercase text-slate-100">BFRD Remote Clicker</h1>
                <p id="statusTxt" class="text-[10px] text-amber-400 font-semibold flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse inline-block"></span> Menyambung ke skrin komputer...
                </p>
            </div>
        </div>

        <!-- Disconnect / Reconnect Button -->
        <button id="btnDisconnect" onclick="handleDisconnectClick()" class="text-xs font-bold px-3 py-1.5 rounded-xl border border-red-500/50 bg-red-950/60 hover:bg-red-900 text-red-200 transition-all flex items-center gap-1.5 shadow-md">
            <i id="btnDisconnectIcon" class="fa-solid fa-power-off text-[11px] text-red-400"></i>
            <span id="btnDisconnectText">Putuskan (Disconnect)</span>
        </button>
    </header>

    <!-- Manual Room ID Box (Fallback if URL query parameter was not passed) -->
    <div id="manualIdCard" class="hidden my-3 p-3 rounded-2xl bg-slate-900/90 border border-amber-500/30 text-center shadow-lg">
        <div class="text-[11px] font-bold text-amber-300 mb-1.5 flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-key"></i> <span>Masukkan Kod ID Bilik Komputer:</span>
        </div>
        <div class="flex gap-2">
            <input type="text" id="manualIdInput" placeholder="Contoh: BFRD-1234" class="flex-1 px-3 py-1.5 text-xs rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 uppercase text-center font-bold tracking-wider">
            <button onclick="connectWithManualId()" class="px-3.5 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl">Sambung</button>
        </div>
    </div>

    <!-- Main Controller Pad -->
    <main class="my-auto space-y-5 py-4">
        <!-- Big Navigation Buttons -->
        <div class="grid grid-cols-2 gap-4">
            <button onclick="sendCommand({action: 'prev'})" class="btn-ctrl bg-slate-800/90 active:bg-slate-700 border-2 border-slate-700 py-8 rounded-3xl flex flex-col items-center justify-center gap-2 shadow-xl">
                <i class="fa-solid fa-chevron-left text-3xl text-amber-400"></i>
                <span class="text-sm font-extrabold uppercase tracking-wider text-slate-200">Sebelumnya (Prev)</span>
            </button>
            <button onclick="sendCommand({action: 'next'})" class="btn-ctrl bg-gradient-to-br from-red-600 to-red-800 active:from-red-700 active:to-red-900 border-2 border-red-500/50 py-8 rounded-3xl flex flex-col items-center justify-center gap-2 shadow-2xl">
                <i class="fa-solid fa-chevron-right text-3xl text-white"></i>
                <span class="text-sm font-extrabold uppercase tracking-wider text-white">Seterusnya (Next)</span>
            </button>
        </div>

        <!-- Language Switch on Screen -->
        <div class="grid grid-cols-2 gap-3 bg-slate-900/80 p-2 rounded-2xl border border-slate-800">
            <button id="btnLangMs" onclick="handleLangClick('ms')" class="btn-ctrl py-2.5 rounded-xl font-bold text-xs bg-amber-500/20 text-amber-300 border-2 border-amber-400 shadow-md transition-all">
                Bahasa Melayu
            </button>
            <button id="btnLangEn" onclick="handleLangClick('en')" class="btn-ctrl py-2.5 rounded-xl font-semibold text-xs bg-slate-800 text-slate-400 border border-slate-700 transition-all">
                English
            </button>
        </div>

        <!-- Direct 12 Modules Jumper (Completely Free of Emojis) -->
        <div class="space-y-2">
            <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Lompat Ke Modul Tertentu:</div>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button onclick="handleModuleClick(0)" data-slide="0" class="btn-ctrl module-btn p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">1. Visi & Misi</button>
                <button onclick="handleModuleClick(1)" data-slide="1" class="btn-ctrl module-btn p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">2. Operasi Menyelamat</button>
                <button onclick="handleModuleClick(2)" data-slide="2" class="btn-ctrl module-btn p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">3. Khidmat Khas</button>
                <button onclick="handleModuleClick(3)" data-slide="3" class="btn-ctrl module-btn p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">4. Kerja Bukan Cemas</button>
                <button onclick="handleModuleClick(4)" data-slide="4" class="btn-ctrl module-btn p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">5. Cara Memohon</button>
                <button onclick="handleModuleClick(5)" data-slide="5" class="btn-ctrl module-btn p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">6. Syarat Am</button>
                <button onclick="handleModuleClick(6)" data-slide="6" class="btn-ctrl module-btn p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">7. Pangkat & Jawatan</button>
                <button onclick="handleModuleClick(7)" data-slide="7" class="btn-ctrl module-btn p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">8. Syarat Fizikal</button>
                <button onclick="handleModuleClick(8)" data-slide="8" class="btn-ctrl module-btn p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">9. IPPT Fizikal</button>
                <button onclick="handleModuleClick(9)" data-slide="9" class="btn-ctrl module-btn p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">10. Ujian Praktikal</button>
                <button onclick="handleModuleClick(10)" data-slide="10" class="btn-ctrl module-btn p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">11. Kursus & Latihan</button>
                <button onclick="handleModuleClick(11)" data-slide="11" class="btn-ctrl module-btn p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">12. Hubungi Kami</button>
            </div>
        </div>
    </main>

    <!-- Footer Controls with Ke Muka Depan & Buka Slaid (View Slides) -->
    <footer class="pt-3 border-t border-slate-800 flex justify-between items-center gap-2.5 text-xs">
        <button onclick="sendCommand({action: 'home'})" class="btn-ctrl flex-1 py-2.5 rounded-xl bg-slate-800/90 active:bg-slate-700 text-slate-200 font-bold border border-slate-700 flex items-center justify-center gap-1.5 transition-all">
            <i class="fa-solid fa-house text-amber-400"></i>
            <span>Ke Muka Depan</span>
        </button>
        <button onclick="sendCommand({action: 'openSlides'})" class="btn-ctrl flex-1 py-2.5 rounded-xl bg-gradient-to-r from-red-700 to-red-600 active:from-red-800 active:to-red-700 text-white font-bold border border-amber-500/50 flex items-center justify-center gap-1.5 shadow-lg shadow-red-950/60 transition-all">
            <i class="fa-solid fa-book-open text-amber-300"></i>
            <span>Buka Slaid (View Slides)</span>
        </button>
    </footer>

    <!-- Rock-Solid WebSocket Real-Time Connection Logic (Zero Emojis, Works on Any Network/4G/5G) -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let currentTargetId = urlParams.get('id');

        const statusTxt = document.getElementById('statusTxt');
        const iconStatus = document.getElementById('iconStatus');
        const btnDisconnect = document.getElementById('btnDisconnect');
        const btnDisconnectText = document.getElementById('btnDisconnectText');
        const btnDisconnectIcon = document.getElementById('btnDisconnectIcon');
        const manualIdCard = document.getElementById('manualIdCard');
        const manualIdInput = document.getElementById('manualIdInput');

        let mqttClient = null;
        let isConnected = false;
        let isIntentionalDisconnect = false;
        let connectTimeout = null;

        const BROKERS = [
            { host: "broker.hivemq.com", port: 8884, path: "/mqtt" },
            { host: "broker.emqx.io", port: 8084, path: "/mqtt" }
        ];
        let currentBrokerIndex = 0;

        function startConnection() {
            isIntentionalDisconnect = false;
            clearTimeout(connectTimeout);

            if (!currentTargetId) {
                statusTxt.className = "text-[10px] text-amber-400 font-semibold flex items-center gap-1.5";
                statusTxt.innerHTML = '<i class="fa-solid fa-circle-exclamation text-amber-400"></i> Sila masukkan Kod ID Bilik di bawah:';
                manualIdCard.classList.remove('hidden');
                btnDisconnect.className = "text-xs font-bold px-3 py-1.5 rounded-xl border border-emerald-500/50 bg-emerald-950/60 hover:bg-emerald-900 text-emerald-200 transition-all flex items-center gap-1.5 shadow-md";
                btnDisconnectIcon.className = "fa-solid fa-plug text-[11px] text-emerald-400";
                btnDisconnectText.textContent = "Sambung (Connect)";
                return;
            }

            manualIdCard.classList.add('hidden');
            statusTxt.className = "text-[10px] text-amber-400 font-semibold flex items-center gap-1.5";
            statusTxt.innerHTML = '<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse inline-block mr-1"></span> Menyambung ke skrin komputer...';
            iconStatus.className = "w-9 h-9 rounded-xl bg-amber-500/20 text-amber-400 border border-amber-500/40 flex items-center justify-center font-bold text-sm shadow-lg";
            btnDisconnect.className = "text-xs font-bold px-3 py-1.5 rounded-xl border border-red-500/50 bg-red-950/60 hover:bg-red-900 text-red-200 transition-all flex items-center gap-1.5 shadow-md";
            btnDisconnectIcon.className = "fa-solid fa-power-off text-[11px] text-red-400";
            btnDisconnectText.textContent = "Putuskan (Disconnect)";

            if (mqttClient && mqttClient.isConnected()) {
                try { mqttClient.disconnect(); } catch(e) {}
            }

            const broker = BROKERS[currentBrokerIndex];
            const clientId = "bfrd_remote_" + Math.random().toString(16).substr(2, 8);
            mqttClient = new Paho.MQTT.Client(broker.host, broker.port, broker.path, clientId);

            mqttClient.onConnectionLost = function(responseObject) {
                if (!isIntentionalDisconnect) {
                    console.warn("MQTT connection lost:", responseObject.errorMessage);
                    setDisconnectedUI(false);
                    // Auto reconnect after 3 seconds
                    setTimeout(() => {
                        if (!isIntentionalDisconnect && currentTargetId) {
                            startConnection();
                        }
                    }, 3000);
                }
            };

            mqttClient.onMessageArrived = function(message) {
                try {
                    const data = JSON.parse(message.payloadString);
                    if (data.status === 'online' || data.status === 'ready') {
                        setConnectedUI();
                    }
                    if (typeof data.slide === 'number') {
                        setActiveSlideButton(data.slide);
                    }
                    if (data.lang) {
                        setLanguageUI(data.lang);
                    }
                } catch(e) {}
            };

            const options = {
                useSSL: true,
                timeout: 6,
                keepAliveInterval: 30,
                cleanSession: true,
                onSuccess: function() {
                    console.log("Connected to broker:", broker.host);
                    // Subscribe to host status
                    const statusTopic = "bfrd/room/" + currentTargetId + "/status";
                    mqttClient.subscribe(statusTopic, { qos: 1 });

                    // Send ping to host
                    sendCommand({ action: 'ping' });

                    // Mark as connected
                    setConnectedUI();
                },
                onFailure: function(err) {
                    console.error("Broker connection failed:", err);
                    // Try next broker
                    currentBrokerIndex = (currentBrokerIndex + 1) % BROKERS.length;
                    if (!isIntentionalDisconnect) {
                        setTimeout(startConnection, 1500);
                    }
                }
            };

            try {
                mqttClient.connect(options);
            } catch(e) {
                console.error("MQTT client error:", e);
                setDisconnectedUI(false);
            }
        }

        function setConnectedUI() {
            isConnected = true;
            statusTxt.className = "text-[10px] text-emerald-400 font-bold flex items-center gap-1.5";
            statusTxt.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 inline-block mr-1"></span> Tersambung dengan Skrin Komputer!';
            iconStatus.className = "w-9 h-9 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 flex items-center justify-center font-bold text-sm shadow-lg shadow-emerald-950";
            btnDisconnect.className = "text-xs font-bold px-3 py-1.5 rounded-xl border border-red-500/50 bg-red-950/60 hover:bg-red-900 text-red-200 transition-all flex items-center gap-1.5 shadow-md";
            btnDisconnectIcon.className = "fa-solid fa-power-off text-[11px] text-red-400";
            btnDisconnectText.textContent = "Putuskan (Disconnect)";
            if (navigator.vibrate) navigator.vibrate(50);
        }

        function setDisconnectedUI(showManual) {
            isConnected = false;
            statusTxt.className = "text-[10px] text-red-400 font-semibold flex items-center gap-1.5";
            statusTxt.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-400 inline-block mr-1"></span> Sambungan Terputus (Disconnected).';
            iconStatus.className = "w-9 h-9 rounded-xl bg-red-500/20 text-red-400 border border-red-500/40 flex items-center justify-center font-bold text-sm shadow-lg";
            btnDisconnect.className = "text-xs font-bold px-3 py-1.5 rounded-xl border border-emerald-500/50 bg-emerald-950/60 hover:bg-emerald-900 text-emerald-200 transition-all flex items-center gap-1.5 shadow-md";
            btnDisconnectIcon.className = "fa-solid fa-plug text-[11px] text-emerald-400";
            btnDisconnectText.textContent = "Sambung Semula (Reconnect)";
            if (showManual || !currentTargetId) {
                manualIdCard.classList.remove('hidden');
            }
        }

        function handleDisconnectClick() {
            if (isConnected || (mqttClient && mqttClient.isConnected())) {
                isIntentionalDisconnect = true;
                if (mqttClient) {
                    try { mqttClient.disconnect(); } catch(e) {}
                }
                setDisconnectedUI(false);
            } else {
                startConnection();
            }
        }

        function connectWithManualId() {
            const val = manualIdInput.value.trim().toUpperCase();
            if (val) {
                currentTargetId = val;
                startConnection();
            }
        }

        function sendCommand(data) {
            if (mqttClient && mqttClient.isConnected() && currentTargetId) {
                try {
                    const message = new Paho.MQTT.Message(JSON.stringify(data));
                    message.destinationName = "bfrd/room/" + currentTargetId + "/cmd";
                    message.qos = 1;
                    mqttClient.send(message);
                    if (navigator.vibrate) navigator.vibrate(25);
                } catch(e) {
                    console.error("Send error:", e);
                }
            } else {
                // Flash status bar warning
                const prevHtml = statusTxt.innerHTML;
                const prevClass = statusTxt.className;
                statusTxt.className = "text-[10px] text-amber-400 font-semibold flex items-center gap-1.5";
                statusTxt.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Belum tersambung. Tekan Sambung Semula.';
                setTimeout(() => {
                    statusTxt.className = prevClass;
                    statusTxt.innerHTML = prevHtml;
                }, 2500);
            }
        }

        
        
        let currentLanguage = 'ms';

        function setLanguageUI(lang) {
            currentLanguage = lang;
            const btnMs = document.getElementById('btnLangMs');
            const btnEn = document.getElementById('btnLangEn');
            if (!btnMs || !btnEn) return;
            if (lang === 'ms') {
                btnMs.className = "btn-ctrl py-2.5 rounded-xl font-bold text-xs bg-amber-500/20 text-amber-300 border-2 border-amber-400 shadow-md transition-all";
                btnEn.className = "btn-ctrl py-2.5 rounded-xl font-semibold text-xs bg-slate-800 text-slate-400 border border-slate-700 transition-all";
            } else {
                btnEn.className = "btn-ctrl py-2.5 rounded-xl font-bold text-xs bg-sky-500/20 text-sky-300 border-2 border-sky-400 shadow-md transition-all";
                btnMs.className = "btn-ctrl py-2.5 rounded-xl font-semibold text-xs bg-slate-800 text-slate-400 border border-slate-700 transition-all";
            }
        }

        function handleLangClick(lang) {
            setLanguageUI(lang);
            sendCommand({ action: 'setLang', lang: lang });
        }

        let currentActiveSlide = 0;

        function setActiveSlideButton(slideIndex) {
            if (typeof slideIndex !== 'number') return;
            currentActiveSlide = slideIndex;
            const buttons = document.querySelectorAll('.module-btn');
            buttons.forEach((btn, idx) => {
                if (idx === slideIndex) {
                    btn.className = "btn-ctrl module-btn p-2.5 rounded-xl bg-amber-500/20 border-2 border-amber-400 text-left font-bold text-amber-300 truncate shadow-lg shadow-amber-950/50 transition-all";
                } else {
                    btn.className = "btn-ctrl module-btn p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate transition-all";
                }
            });
        }

        function handleModuleClick(slideIndex) {
            setActiveSlideButton(slideIndex);
            sendCommand({ action: 'goto', slide: slideIndex });
        }

        // Highlight initial slide & auto start connection
        setActiveSlideButton(0);
        startConnection();
    </script>
</body>
</html>

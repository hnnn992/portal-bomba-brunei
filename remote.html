<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BFRD Presentation Remote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        body {
            background-color: #040b17;
            background-image: radial-gradient(circle at 50% 20%, rgba(220, 38, 38, 0.2) 0%, transparent 60%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            touch-action: manipulation;
        }
        .btn-ctrl:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between p-4 selection:bg-red-600">

    <!-- Header Status -->
    <header class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center font-bold text-white shadow-lg">
                <i class="fa-solid fa-gamepad"></i>
            </div>
            <div>
                <h1 class="text-xs font-black tracking-wider uppercase">BFRD Remote Clicker</h1>
                <p id="statusTxt" class="text-[10px] text-amber-400 font-semibold flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Menyambung ke skrin...
                </p>
            </div>
        </div>
        <a href="presentation.html" class="text-[10px] text-slate-400 border border-slate-700 px-2.5 py-1 rounded-lg">Buka Slaid</a>
    </header>

    <!-- Main Controller Pad -->
    <main class="my-auto space-y-6 py-4">
        <!-- Big Navigation Buttons -->
        <div class="grid grid-cols-2 gap-4">
            <button onclick="sendCommand({action: 'prev'})" class="btn-ctrl bg-slate-800/90 active:bg-slate-700 border-2 border-slate-700 py-8 rounded-3xl flex flex-col items-center justify-center gap-2 shadow-xl">
                <i class="fa-solid fa-chevron-left text-3xl text-amber-400"></i>
                <span class="text-sm font-extrabold uppercase tracking-wider text-slate-200">Sebelumnya (Prev)</span>
            </button>
            <button onclick="sendCommand({action: 'next'})" class="btn-ctrl bg-gradient-to-br from-red-600 to-red-800 active:from-red-700 active:to-red-900 border-2 border-red-500/50 py-8 rounded-3xl flex flex-col items-center justify-center gap-2 shadow-2xl">
                <i class="fa-solid fa-chevron-right text-3xl text-white"></i>
                <span class="text-sm font-extrabold uppercase tracking-wider text-white">Seterusnya (Next)</span>
            </button>
        </div>

        <!-- Language Switch on Screen -->
        <div class="grid grid-cols-2 gap-3 bg-slate-900/80 p-2 rounded-2xl border border-slate-800">
            <button onclick="sendCommand({action: 'setLang', lang: 'ms'})" class="btn-ctrl py-2.5 rounded-xl font-bold text-xs bg-slate-800 text-amber-300 border border-amber-500/30">
                Bahasa Melayu
            </button>
            <button onclick="sendCommand({action: 'setLang', lang: 'en'})" class="btn-ctrl py-2.5 rounded-xl font-bold text-xs bg-slate-800 text-sky-300 border border-sky-500/30">
                English
            </button>
        </div>

        <!-- Direct 12 Modules Jumper -->
        <div class="space-y-2">
            <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Lompat Ke Modul Tertentu:</div>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button onclick="sendCommand({action: 'goto', slide: 0})" class="btn-ctrl p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">1. Visi & Misi</button>
                <button onclick="sendCommand({action: 'goto', slide: 1})" class="btn-ctrl p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">2. Tanggungjawab</button>
                <button onclick="sendCommand({action: 'goto', slide: 2})" class="btn-ctrl p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">3. Khidmat Khas</button>
                <button onclick="sendCommand({action: 'goto', slide: 3})" class="btn-ctrl p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">4. Kerja Bukan Cemas</button>
                <button onclick="sendCommand({action: 'goto', slide: 4})" class="btn-ctrl p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">5. Cara Memohon</button>
                <button onclick="sendCommand({action: 'goto', slide: 5})" class="btn-ctrl p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">6. Syarat Am</button>
                <button onclick="sendCommand({action: 'goto', slide: 6})" class="btn-ctrl p-2.5 rounded-xl bg-slate-900 border border-amber-500/40 text-left font-bold text-amber-300 truncate">⭐ 7. Pangkat & Jawatan</button>
                <button onclick="sendCommand({action: 'goto', slide: 7})" class="btn-ctrl p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">8. Syarat Fizikal</button>
                <button onclick="sendCommand({action: 'goto', slide: 8})" class="btn-ctrl p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">9. IPPT Fizikal</button>
                <button onclick="sendCommand({action: 'goto', slide: 9})" class="btn-ctrl p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">10. Ujian Praktikal</button>
                <button onclick="sendCommand({action: 'goto', slide: 10})" class="btn-ctrl p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">11. Kursus & Latihan</button>
                <button onclick="sendCommand({action: 'goto', slide: 11})" class="btn-ctrl p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-left font-semibold text-slate-200 truncate">12. Hubungi Kami</button>
            </div>
        </div>
    </main>

    <!-- Footer Controls -->
    <footer class="pt-3 border-t border-slate-800 flex justify-between items-center text-xs">
        <button onclick="sendCommand({action: 'home'})" class="btn-ctrl px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 font-bold border border-slate-700">
            <i class="fa-solid fa-house mr-1"></i> Ke Muka Depan
        </button>
        <span class="text-[10px] text-slate-500">Jabatan Bomba & Penyelamat Brunei</span>
    </footer>

    <!-- PeerJS Connection Logic -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const hostPeerId = urlParams.get('id');
        const statusTxt = document.getElementById('statusTxt');

        let conn = null;

        if (!hostPeerId) {
            statusTxt.className = "text-[10px] text-red-400 font-semibold";
            statusTxt.innerHTML = "❌ Kod bilik tidak dijumpai. Sila imbas semula QR di komputer.";
        } else {
            const peer = new Peer();

            peer.on('open', (id) => {
                statusTxt.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Menyambung ke skrin komputer...`;
                conn = peer.connect(hostPeerId, { reliable: true });

                conn.on('open', () => {
                    statusTxt.className = "text-[10px] text-emerald-400 font-bold flex items-center gap-1.5";
                    statusTxt.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Tersambung dengan Skrin Komputer!`;
                    if (navigator.vibrate) navigator.vibrate(50);
                });

                conn.on('close', () => {
                    statusTxt.className = "text-[10px] text-red-400 font-semibold";
                    statusTxt.innerHTML = `⚠️ Terputus. Sila muat semula halaman.`;
                });
            });

            peer.on('error', (err) => {
                statusTxt.className = "text-[10px] text-red-400 font-semibold";
                statusTxt.innerHTML = `Ralat sambungan: ` + err.type;
            });
        }

        function sendCommand(data) {
            if (conn && conn.open) {
                conn.send(data);
                if (navigator.vibrate) navigator.vibrate(25);
            } else {
                alert("Sambungan ke skrin belum aktif. Sila tunggu seketika.");
            }
        }
    </script>
</body>
</html>
